<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <style>
    /* 룩북 그리드 — 8개씩 페이지네이션(아래 스크립트), 한 묶음뿐이면 화살표·도트 숨김 */
    .lookbook-gallery { position: relative; }
    .lookbook-grid { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .gallery-item { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--ink); border-radius: 12px; background: #fff; cursor: pointer; transition: transform 0.25s ease; }
    .gallery-item:hover { transform: translateY(-4px); }
    .lookbook-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 38px; height: 38px; border: 1px solid var(--ink); border-radius: 50%; background: var(--paper); font-size: 20px; line-height: 1; }
    .lookbook-arrow:hover { background: var(--ink); color: var(--paper); }
    .lookbook-arrow.left { left: -19px; }
    .lookbook-arrow.right { right: -19px; }
    .lookbook-dots { display: flex; justify-content: center; gap: 8px; margin-top: 26px; }
    .lookbook-dots .dot { width: 10px; height: 10px; border: 1px solid var(--ink); border-radius: 50%; cursor: pointer; }
    .lookbook-dots .dot.active { background: var(--ink); }
    .lookbook-gallery:has(.lookbook-dots .dot:only-child) .lookbook-arrow,
    .lookbook-gallery:has(.lookbook-dots .dot:only-child) .lookbook-dots { display: none; }

    /* 룩북 확대 모달 — 왼쪽 사진 / 오른쪽 착용 제품 */
    .lb-body { position: relative; display: flex; flex-wrap: wrap; gap: 28px; width: 100%; max-width: 980px; margin: auto; padding: 26px; border: 1px solid var(--ink); border-radius: 18px; background: var(--paper); }
    .modal-left { flex: 1 1 54%; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .lb-stage { position: relative; display: flex; justify-content: center; width: 100%; }
    .lb-modal #modalImage { width: auto; max-width: 100%; max-height: 66vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 36px; height: 36px; border: 1px solid var(--ink); border-radius: 50%; background: var(--paper); font-size: 18px; line-height: 1; }
    .lb-arrow:hover { background: var(--ink); color: var(--paper); }
    .lb-arrow.left { left: 8px; }
    .lb-arrow.right { right: 8px; }
    .lb-thumbs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0; }
    .lb-thumbs img { width: 52px; height: 52px; object-fit: cover; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; opacity: 0.55; }
    .lb-thumbs img.active { opacity: 1; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .lb-info { flex: 1 1 30%; min-width: 240px; padding: 6px 0; }
    .lb-info .label { color: var(--muted); }
    .lb-info h3 { margin: 8px 0 14px; padding-right: 30px; font-size: 22px; font-weight: 950; line-height: 1.15; letter-spacing: -0.04em; }
    .lb-info .pill { margin-top: 20px; }

    @media (max-width: 1024px) { .lookbook-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 768px) {
      .lookbook-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .lookbook-arrow.left { left: -8px; }
      .lookbook-arrow.right { right: -8px; }
      .lb-body { padding: 16px; gap: 16px; }
      .lb-modal #modalImage { max-height: 52vh; }
      .lb-thumbs { display: none; }
      .lb-info { min-width: 0; flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { .gallery-item { transition: none; } }
  </style>

    let currentGallery = [];
    let currentIndex = 0;
  
    function openGallery(galleryKey, startIndex = 0) {
      currentGallery = galleryMap[galleryKey];
      currentIndex = startIndex;
      modal.style.display = "flex";
      document.body.style.overflow = 'hidden'; // 📌 추가: 스크롤 막기
      
      updateModalView();
  
      // 제품 정보 표시
      const info = productInfo[galleryKey];
      if (info) {
        document.getElementById("productTitle").textContent = info.title;
        document.getElementById("productDesc").innerHTML = info.desc;
        document.getElementById("productLink").href = info.link;
      }
  
      // 썸네일 렌더링
      const thumbContainer = document.getElementById("thumbnailContainer");
      thumbContainer.innerHTML = "";
      currentGallery.forEach((src, i) => {
        const thumb = document.createElement("img");
        thumb.src = src;
        if (i === currentIndex) thumb.classList.add("active");
        thumb.onclick = () => {
          currentIndex = i;
          updateModalView();
        };
        thumbContainer.appendChild(thumb);
      });
  
      // 도트 렌더링
      const dotContainer = document.getElementById("dotContainer");
      dotContainer.innerHTML = "";
      currentGallery.forEach((_, i) => {
        const dot = document.createElement("span");
        if (i === currentIndex) dot.classList.add("active");
        dotContainer.appendChild(dot);
      });
    }
  
    function updateModalView() {
      modalImg.src = currentGallery[currentIndex];
  
      document.querySelectorAll("#thumbnailContainer img").forEach((img, i) => {
        img.classList.toggle("active", i === currentIndex);
      });
  
      document.querySelectorAll("#dotContainer span").forEach((dot, i) => {
        dot.classList.toggle("active", i === currentIndex);
      });
    }
  
    // 슬라이드 드래그/터치 감지
    // modal-left 안에서 시작된 제스처만 판정 (바깥에서 드래그해 들어와 놓으면 stale startX로 오동작)
    let startX = 0;
    let swipeStarted = false;

    modalLeft.addEventListener("mousedown", (e) => {
      startX = e.clientX;
      swipeStarted = true;
    });

    modalLeft.addEventListener("mouseup", (e) => {
      if (!swipeStarted) return;
      swipeStarted = false;
      let endX = e.clientX;
      handleSwipe(endX - startX);
    });

    modalLeft.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      swipeStarted = true;
    });

    modalLeft.addEventListener("touchend", (e) => {
      if (!swipeStarted) return;
      swipeStarted = false;
      let endX = e.changedTouches[0].clientX;
      handleSwipe(endX - startX);
    });
  
    function handleSwipe(deltaX) {
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) {
          currentIndex = (currentIndex + 1) % currentGallery.length;
        } else {
          currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        }
        updateModalView();
      }
    }
    
    function closeModal() {

      item.addEventListener("click", () => {

    });

    });

      currentIndex = (currentIndex + 1) % currentGallery.length;
      updateModalView();
    });

      updateModalView();
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % currentGallery.length;
      updateModalView();

  <script>
    // Lookbook grid pagination logic
    // 스크립트가 그리드 마크업 뒤에 위치하므로 즉시 실행 — 인라인 onclick이
    // DOMContentLoaded를 기다리지 않고 prevGridSlide/nextGridSlide를 쓸 수 있게 함
    (() => {
      let gridCurrent = 0;
      const itemsPerPage = 8;
      const gridItems = document.querySelectorAll('.lookbook-grid .gallery-item');
      const gridTotalPages = Math.ceil(gridItems.length / itemsPerPage);
      const container = document.getElementById("gridDotContainer");

      function updateGridView() {
        gridItems.forEach((item, idx) => {
          item.style.display = (Math.floor(idx / itemsPerPage) === gridCurrent) ? 'block' : 'none';
        });
        updateGridDots();
      }

      function updateGridDots() {
        container.innerHTML = '';
        for (let i = 0; i < gridTotalPages; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot' + (i === gridCurrent ? ' active' : '');
          dot.onclick = () => {
            gridCurrent = i;
            updateGridView();
          };
          container.appendChild(dot);
        }
      }

      window.prevGridSlide = function () {
        gridCurrent = (gridCurrent - 1 + gridTotalPages) % gridTotalPages;
        updateGridView();
      }

      window.nextGridSlide = function () {
        gridCurrent = (gridCurrent + 1) % gridTotalPages;
        updateGridView();
      }

      updateGridView();
    })();
  </script>
