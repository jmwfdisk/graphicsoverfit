  <style>
    /* 전체 페이지 배경을 검정색으로 설정 */
    body {
      background: url("./image/stbg.png") no-repeat center center fixed;
      background-size: cover; /* 화면에 꽉 차게 */
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 왼쪽 세로형 네비게이션바 - 투명하게, 메인 이미지 위에 배치 */
    .side-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 180px;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.3); /* 반투명 검정 */
      z-index: 1000; /* 메인 이미지보다 위에 오게 */
      padding-top: 100px; /* 위쪽 여백 (로고 또는 상단 공간 확보) */
      transition: background-color 0.3s;
    }

    .side-nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    .side-nav li {
      text-align: left;
    }

    .side-nav a {
      display: block;
      color: #fff;
      padding: 12px 16px;
      text-decoration: none;
      font-size: 16px;
    }

    .side-nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* 로고를 네비바 상단에 고정 */
    .floating-logo {
      position: fixed;     /* 스크롤해도 유지 */
      top: 4px;            /* 상단에서 살짝 아래 */
      left: 90px;          /* 사이드바(180px) 정중앙 */
      transform: translateX(-50%); /* 가로 정중앙 */
      z-index: 1100;
    }

    /* 로고 이미지 스타일 */
    .logo-image {
      width: 83px;    /* 104px에서 20% 추가 축소 */
      height: 83px;
      object-fit: contain; /* 비율 유지하며 채우기 */
      background: transparent;
    }

    /* 페이지 상단 중앙 크레용 로고 */
    .top-center-logo {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
    }

    .top-center-logo img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      background: transparent;
    }

    .lookbook-gallery {
      position: relative;         /* top 속성 작동하려면 필요 */
      margin-top: 50px;          /* 여기서 원하는 만큼 조정하세요 */
      margin-left: 180px;         /* 사이드 네비에 맞춰 조정 */
      padding: 60px;
    }

    .lookbook-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .gallery-item {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 5;   /* 원하는 비율: 1/1(정사각), 3/4 등으로 바꿔도 됨 */
      height: auto;          /* aspect-ratio가 높이 계산 */
      object-fit: cover;     /* 중앙 기준으로 넘치는 부분 잘라내기 */
      object-position: center;
      border-radius: 6px;
    }

    .gallery-item:hover {
      transform: scale(1.02);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-body {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 40px;
      max-width: 90%;
      max-height: 90%;
    }

    .modal-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .modal-content {
      max-width: 600px;
      max-height: 70vh;
      object-fit: contain;
    }

    .modal-thumbnails {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .modal-thumbnails img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      opacity: 0.5;
      cursor: pointer;
      border-radius: 4px;
      transition: opacity 0.2s;
    }

    .modal-thumbnails img.active {
      opacity: 1;
      border: 2px solid white;
    }

    .modal-dots {
      margin-top: 10px;
      text-align: center;
    }

    .modal-dots span {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 4px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .modal-dots span.active {
      background-color: white;
    }

    .modal-info {
      flex: 1;
      min-width: 300px;
      max-width: 400px;
      font-size: 14px;
      line-height: 1.6;
      color: #fff;
      text-align: center;
    }

    .product-button {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background-color: #ffffff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s, color 0.3s;
    }

    .product-button:hover {
      background-color: #333;
      color: #fff;
    }

    /* 좌우 화살표 버튼 스타일 */
    .arrow-button {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border-radius: 50%;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      z-index: 3200;
      padding: 0;
      line-height: normal; 
    }

    .arrow-button:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .arrow-button.left {
      left: 10px;
    }

    .arrow-button.right {
      right: 10px;
    }
    /* 푸터 스타일 */
    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }

    footer p {
      margin: 5px 0;
      font-size: 12px;
    }

    .hamburger {
      display: none;
    }
    /* 모달 닫기 버튼 (PC/모바일 모두 동일 스타일) */
    .modal-close {
      display: block;
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 28px;
      color: #fff;
      background: none;
      border: none;
      z-index: 4000;
      cursor: pointer;
    }

    .side-nav li {
      position: relative;
    }

    .side-nav li ul {
      opacity: 0;
      transform: translateY(-10px); /* 위에서 살짝 내려오게 */
      filter: blur(4px); /* 흐림 효과 */
      max-height: 0;
      overflow: hidden;
      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        filter 0.3s ease,
        max-height 0.5s ease;
    }

    .side-nav li:hover ul {
      opacity: 1;
      transform: translateY(0); /* 원래 위치로 */
      filter: blur(0);
      max-height: 300px;
    }

    .side-nav li ul li a {
      padding-left: 24px;
      font-size: 14px;
    }

    .dot-arrow {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
      border-radius: 4px;
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    .dot-arrow:hover {
      background-color: rgba(255, 255, 255, 0.5);
      color: black;
    }

    /* Lookbook grid navigation styles */
    .lookbook-nav {
      position: relative;
      width: 100%;
      margin-top: 20px;
      height: 0;
    }

    .lookbook-arrow {
      font-size: 100px;
      font-weight: 100;
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 5;
      color: white;
      opacity: 1;
      transition: transform 0.2s ease;
      cursor: pointer;
      user-select: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2000;
    }

    .lookbook-arrow.left {
      left: -40px;
    }

    .lookbook-arrow.right {
      right: -40px;
    }

    .lookbook-arrow:hover {
      transform: translateY(-50%) scale(1.3);
    }

    .lookbook-dots {
      position: relative;
      top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .lookbook-dots .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: gray;
      margin: 0 4px;
      display: inline-block;
      transition: background-color 0.3s;
    }

    .lookbook-dots .dot.active {
      background-color: white;
    }

    let currentGallery = [];
    let currentIndex = 0;
  
    function openGallery(galleryKey, startIndex = 0) {
      currentGallery = galleryMap[galleryKey];
      currentIndex = startIndex;
      modal.style.display = "flex";
      document.body.style.overflow = 'hidden'; // 📌 추가: 스크롤 막기
      
      updateModalView();
  
      // 제품 정보 표시
      const info = productInfo[galleryKey];
      if (info) {
        document.getElementById("productTitle").textContent = info.title;
        document.getElementById("productDesc").innerHTML = info.desc;
        document.getElementById("productLink").href = info.link;
      }
  
      // 썸네일 렌더링
      const thumbContainer = document.getElementById("thumbnailContainer");
      thumbContainer.innerHTML = "";
      currentGallery.forEach((src, i) => {
        const thumb = document.createElement("img");
        thumb.src = src;
        if (i === currentIndex) thumb.classList.add("active");
        thumb.onclick = () => {
          currentIndex = i;
          updateModalView();
        };
        thumbContainer.appendChild(thumb);
      });
  
      // 도트 렌더링
      const dotContainer = document.getElementById("dotContainer");
      dotContainer.innerHTML = "";
      currentGallery.forEach((_, i) => {
        const dot = document.createElement("span");
        if (i === currentIndex) dot.classList.add("active");
        dotContainer.appendChild(dot);
      });
    }
  
    function updateModalView() {
      modalImg.src = currentGallery[currentIndex];
  
      document.querySelectorAll("#thumbnailContainer img").forEach((img, i) => {
        img.classList.toggle("active", i === currentIndex);
      });
  
      document.querySelectorAll("#dotContainer span").forEach((dot, i) => {
        dot.classList.toggle("active", i === currentIndex);
      });
    }
  
    // 슬라이드 드래그/터치 감지
    // modal-left 안에서 시작된 제스처만 판정 (바깥에서 드래그해 들어와 놓으면 stale startX로 오동작)
    let startX = 0;
    let swipeStarted = false;

    modalLeft.addEventListener("mousedown", (e) => {
      startX = e.clientX;
      swipeStarted = true;
    });

    modalLeft.addEventListener("mouseup", (e) => {
      if (!swipeStarted) return;
      swipeStarted = false;
      let endX = e.clientX;
      handleSwipe(endX - startX);
    });

    modalLeft.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      swipeStarted = true;
    });

    modalLeft.addEventListener("touchend", (e) => {
      if (!swipeStarted) return;
      swipeStarted = false;
      let endX = e.changedTouches[0].clientX;
      handleSwipe(endX - startX);
    });
  
    function handleSwipe(deltaX) {
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) {
          currentIndex = (currentIndex + 1) % currentGallery.length;
        } else {
          currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
        }
        updateModalView();
      }
    }
    
    function closeModal() {
         modal.style.display = "none";
         document.body.style.overflow = 'auto'; // 📌 스크롤 다시 허용
    }
    
    // 타일 클릭 시 갤러리 열기
    galleryItems.forEach(item => {
      const galleryKey = item.getAttribute("data-gallery");
      if (!galleryKey || !galleryMap[galleryKey]) return;
      item.addEventListener("click", () => {
        openGallery(galleryKey, 0);
      });
    });
  
    // 모달 외부 클릭 시 닫기
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal(); // 📌 함수로 교체
      }
    });
  
    // ESC 키 누르면 닫기 (옵션)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeModal(); // 📌 함수로 교체
      }
    });
  
    // 모바일 메뉴 닫기
    document.addEventListener("DOMContentLoaded", () => {
      const menuLinks = document.querySelectorAll('.side-nav a');
      menuLinks.forEach(link => {
        link.addEventListener('click', () => {
          document.querySelector('.side-nav').classList.remove('active');
        });
      });
    });
  
    document.addEventListener('click', (e) => {
      const sideNav = document.querySelector('.side-nav');
      const hamburger = document.querySelector('.hamburger');
      if (!sideNav.contains(e.target) && !hamburger.contains(e.target)) {
        sideNav.classList.remove('active');
      }
    });

    // 좌우 화살표 버튼 이벤트
    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
      updateModalView();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % currentGallery.length;
      updateModalView();
    });

    function prevImage() {
      currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
      updateModalView();
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % currentGallery.length;
      updateModalView();
    }
  </script>
  <script>
    // Lookbook grid pagination logic
    // 스크립트가 그리드 마크업 뒤에 위치하므로 즉시 실행 — 인라인 onclick이
    // DOMContentLoaded를 기다리지 않고 prevGridSlide/nextGridSlide를 쓸 수 있게 함
    (() => {
      let gridCurrent = 0;
      const itemsPerPage = 8;
      const gridItems = document.querySelectorAll('.lookbook-grid .gallery-item');
      const gridTotalPages = Math.ceil(gridItems.length / itemsPerPage);
      const container = document.getElementById("gridDotContainer");

      function updateGridView() {
        gridItems.forEach((item, idx) => {
          item.style.display = (Math.floor(idx / itemsPerPage) === gridCurrent) ? 'block' : 'none';
        });
        updateGridDots();
      }

      function updateGridDots() {
        container.innerHTML = '';
        for (let i = 0; i < gridTotalPages; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot' + (i === gridCurrent ? ' active' : '');
          dot.onclick = () => {
            gridCurrent = i;
            updateGridView();
          };
          container.appendChild(dot);
        }
      }

      window.prevGridSlide = function () {
        gridCurrent = (gridCurrent - 1 + gridTotalPages) % gridTotalPages;
        updateGridView();
      }

      window.nextGridSlide = function () {
        gridCurrent = (gridCurrent + 1) % gridTotalPages;
        updateGridView();
      }

      updateGridView();
    })();
  </script>
