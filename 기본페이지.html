<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphics Overfit</title>
  <!-- 최소 페이지 템플릿. 하위 폴더에 복사해 쓸 때는 아래 ./ 경로 5곳(favicon, css, js 3개)과 본문 이미지 경로를 ../ 로 바꾼다.
       상단 메뉴·푸터와 메뉴 링크는 assets/site.js가 폴더 깊이에 맞춰 자동으로 넣으므로 손댈 필요 없음. -->
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./assets/site.css" />
</head>

<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="section section--first">
      <div class="wrap">
        <div class="section-head">
          <p class="label"><span>01</span><span>·</span><span>Page label</span></p>
          <div class="section-head-grid">
            <h1 class="display display--md">PAGE <span class="outline">TITLE</span><span class="title-dot">.</span></h1>
            <p class="lead">페이지 소개 문구를 여기에 씁니다.</p>
          </div>
        </div>

        <div class="product-grid">
          <div class="product">
            <img src="./NewTrending/image/new/new-01-f.png" class="front" alt="앞면" loading="lazy">
            <img src="./NewTrending/image/new/new-01-b.png" class="back" alt="뒷면" loading="lazy">
            <div class="product-info">Brush Typography Logo TEE<small>01 / Basic</small></div>
          </div>
          <div class="product">
            <img src="./NewTrending/image/new/new-02-f.png" class="front" alt="앞면" loading="lazy">
            <img src="./NewTrending/image/new/new-02-b.png" class="back" alt="뒷면" loading="lazy">
            <div class="product-info">ESSENTIAL LOGO TEE<small>02 / Basic</small></div>
          </div>
          <div class="product">
            <img src="./NewTrending/image/coming soon.png" class="front" alt="준비중" loading="lazy">
            <div class="product-info">coming soon<small>03 / 준비중</small></div>
          </div>
          <div class="product">
            <img src="./NewTrending/image/coming soon.png" class="front" alt="준비중" loading="lazy">
            <div class="product-info">coming soon<small>04 / 준비중</small></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./Shop/config.js"></script>
  <script src="./Shop/cart.js"></script>
  <script src="./assets/site.js"></script>
</body>
</html>
