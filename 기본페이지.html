<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphics Overfit Concept art</title>

  <style>
    /* 전체 페이지 배경을 검정색으로 설정 */
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    /* 왼쪽 세로형 네비게이션바 - 투명하게, 메인 이미지 위에 배치 */
    .side-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 180px;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.3); /* 반투명 검정 */
      z-index: 1000; /* 메인 이미지보다 위에 오게 */
      padding-top: 100px; /* 위쪽 여백 (로고 또는 상단 공간 확보) */
      transition: background-color 0.3s;
    }

    .side-nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    .side-nav li {
      text-align: left;
    }

    .side-nav a {
      display: block;
      color: #fff;
      padding: 12px 16px;
      text-decoration: none;
      font-size: 16px;
    }

    .side-nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* 로고를 네비바 상단에 고정 */
    .floating-logo {
      position: fixed;     /* 스크롤해도 유지 */
      top: 4px;            /* 상단에서 살짝 아래 */
      left: 90px;          /* 사이드바(180px) 정중앙 */
      transform: translateX(-50%); /* 가로 정중앙 */
      z-index: 1100;
    }

    /* 로고 이미지 스타일 */
    .logo-image {
      width: 83px;    /* 104px에서 20% 추가 축소 */
      height: 83px;
      object-fit: contain; /* 비율 유지하며 채우기 */
      background: transparent;
    }

    /* 페이지 상단 중앙 크레용 로고 */
    .top-center-logo {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
    }

    .top-center-logo img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      background: transparent;
    }

    /* 푸터 스타일 */
    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }

    footer p {
      margin: 5px 0;
      font-size: 12px;
    }

    .hamburger {
      display: none;
    }

@media (max-width: 768px) {
    .floating-logo {
      display: none; /* 모바일 상단 로고는 크레용 로고로 대체 */
    }

    .top-center-logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
    }

    .top-center-logo img {
      width: 90px;
      height: auto;
    }

    .side-nav {
      width: 100%; /* 가로 전체 차지 */
      height: auto; /* 자동 높이 */
      background-color: rgba(0, 0, 0, 0.9); /* 더 선명하게 */
      position: fixed;
      top: 0;
      left: 0;
      z-index: 3000;
      padding-top: 60px; /* 위 여백 */
    }

    .side-nav ul {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .side-nav li {
      text-align: center;
      width: 100%;
    }

    .side-nav a {
      padding: 16px;
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .floating-logo {
      top: 10px;
      width: 80px;
    }
  
    .floating-logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      width: 90px;
      height: auto;
      pointer-events: auto;
    }

    .logo-image {
      width: 90px;
      height: auto;
    }

    .hamburger {
      display: block;
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 28px;
      color: white;
      z-index: 2000;
      cursor: pointer;
    }

    .side-nav {
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      width: 220px;
      background-color: rgba(0, 0, 0, 0.95);
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 80px;
      z-index: 3000;
    }

    .side-nav.active {
      transform: translateX(0);
    }

    .side-nav ul {
      flex-direction: column;
      align-items: flex-start;
      padding-left: 20px;
    }
  
    .side-nav li {
      text-align: left;
      width: 100%;
    }
  
    .side-nav a {
      padding: 14px 0;
      display: block;
      width: 100%;
      font-size: 16px;
    }
  }
    
    @media (max-width: 768px) {
      /* mobile-nav-fix 2026-09-28 */
      html, body { overflow-x: hidden; }   /* 가로 넘침으로 iOS가 페이지를 축소해 100% 높이가 화면보다 짧아지는 문제 방지 */
      .side-nav { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 64px; padding-bottom: 40px; box-sizing: border-box; top: 0; bottom: 0; height: 100vh; height: 100dvh; }
      .side-nav::before { content: ""; display: block; width: 105px; height: 45px; margin: 6px auto 14px; background: url("./image/mainlogo.png") center / contain no-repeat; }
      .side-nav li ul { opacity: 0 !important; transform: none !important; filter: none !important; max-height: 0 !important; overflow: hidden !important; padding-left: 0; transition: max-height 0.3s ease, opacity 0.3s ease; }
      .side-nav li.open > ul { opacity: 1 !important; max-height: 300px !important; }
      .side-nav li ul li a { padding-left: 16px; font-size: 14px; color: #ccc; }
      .hamburger { z-index: 3100; }
      .side-nav.active ~ .top-center-logo { visibility: hidden; }
    }
  </style>
</head>

<body>
    <!-- 햄버거 버튼 (모바일 전용) -->
    <div class="hamburger" onclick="toggleMenu()">
      ☰
    </div>

    <!-- 로고 아래 구분선 추가 -->
    <div style="position: relative; top: 85px; width: 98%; height: 3px; background-color: rgba(255, 255, 255, 0.2); margin: 0 auto;"></div>

    <!-- 네비게이션바 영역 -->
    <nav class="side-nav">
        <ul>
          <li><a href="https://graphicsoverfit.com" target="_blank" rel="noopener">Brand Culture</a></li>
          <li><a href="#">Concept art</a></li>
          <li><a href="#">Design Studio<br><span style="font-size: 0.8em; color: #aaa;">(coming soon)</span></a></li>
          <li><a href="#">Look Book</a></li>
          <li><a href="#">New & Trending</a></li>
          <li><a href="./Shop/Shop.html">Shop</a>
            <ul style="list-style: none; padding-left: 10px; font-size: 14px;">
              <li><a href="./Shop/Shop.html">BRAND Store</a></li>
              <li><a href="https://www.musinsa.com/brand/graphicsoverfit/products?categoryCode=001001&gf=A" target="_blank" rel="noopener">MUSINSA Store</a></li>
            </ul>
          </li>
        </ul>
      </nav>

    <div class="floating-logo">
        <a href="../index.html">
          <img src="./image/mainlogo.png" alt="로고" class="logo-image">
        </a>
      </div>

    <!-- 페이지 상단 중앙 크레용 로고 -->
    <div class="top-center-logo">
      <a href="../index.html"><img src="./image/mainlogo2.png" alt="로고"></a>
    </div>

  <script>
    function toggleMenu() {
    const sideNav = document.querySelector('.side-nav');
    sideNav.classList.toggle('active');
    }

        // 모바일 메뉴 닫기
    document.addEventListener("DOMContentLoaded", () => {
      const menuLinks = document.querySelectorAll('.side-nav a');
      menuLinks.forEach(link => {
        link.addEventListener('click', () => {
          document.querySelector('.side-nav').classList.remove('active');
        });
      });
    });
  
    document.addEventListener('click', (e) => {
      const sideNav = document.querySelector('.side-nav');
      const hamburger = document.querySelector('.hamburger');
      if (!sideNav.contains(e.target) && !hamburger.contains(e.target)) {
        sideNav.classList.remove('active');
      }
    });
  </script>

  <script>
    // 모바일 사이드 메뉴: 상위 항목 탭 → 하위 메뉴 아코디언 (2026-09-28)
    (function () {
      const items = document.querySelectorAll('.side-nav > ul > li');
      items.forEach(li => { if (li.querySelector(':scope > ul')) li.classList.add('has-sub'); });
      document.addEventListener('click', function (e) {
        if (window.innerWidth > 768) return;
        const a = e.target.closest('.side-nav > ul > li.has-sub > a');
        if (!a) return;
        e.preventDefault(); e.stopPropagation();
        const li = a.parentElement;
        items.forEach(x => { if (x !== li) x.classList.remove('open'); });
        li.classList.toggle('open');
      }, true);
    })();
  </script>
</body>
</html>
