<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문 완료 | Graphics Overfit</title>
  <link rel="icon" href="./image/favicon.png" />
  <link rel="stylesheet" href="../assets/site.css" />
  <style>
    /* 결제 결과 카드 */
    .result-card { max-width: 580px; margin: 0 auto; }
    .result-card h1 { margin: 0 0 20px; font-size: 26px; font-weight: 950; line-height: 1.15; letter-spacing: -0.05em; }
    .result-card h1.fail, .result-card.is-fail h1 { color: #b8431a; }
    .spinner { width: 28px; height: 28px; margin: 20px auto; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; color: var(--muted); }
    .row b { color: var(--ink); font-family: var(--mono); font-size: 13px; }
    .items { margin: 16px 0; font-size: 13px; line-height: 1.8; color: var(--muted); }
    .va { margin: 14px 0; padding: 12px 14px; border: 1px dashed var(--ink); border-radius: 12px; font-size: 13px; line-height: 1.8; }
    .note { margin-top: 18px; font-size: 12px; line-height: 1.7; color: var(--muted); }
    .note a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .msg { margin: 0 0 10px; font-size: 14px; line-height: 1.7; color: var(--muted); }
    .code { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; color: var(--soft); }
    .hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
    .btns { display: flex; gap: 10px; margin-top: 24px; }
    .btns .btn-full { flex: 1; }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="section section--first">
      <div class="wrap">
        <div class="result-card card-box" id="box">
          <h1>결제를 확인하고 있습니다</h1>
          <div class="spinner"></div>
          <p class="hint">잠시만 기다려 주세요. 창을 닫지 마세요.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./config.js"></script>
  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script>
    const box = document.getElementById('box');
    const won = n => '₩' + new Intl.NumberFormat('ko-KR').format(n);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function run() {
      const p = new URLSearchParams(location.search);
      const paymentKey = p.get('paymentKey'), orderId = p.get('orderId'), amount = Number(p.get('amount'));
      if (!paymentKey || !orderId || !amount) return renderFail('INVALID_URL', '결제 정보가 없습니다. 주문서에서 다시 시도해 주세요.');

      let res, data;
      try {
        res = await fetch(GOF_CONFIG.API_BASE + '/payments/confirm', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentKey, orderId, amount }),
        });
        data = await res.json();
      } catch (e) {
        return renderFail('NETWORK', '서버와 통신하지 못했습니다. 결제가 완료되었는지 이메일을 확인하시거나 문의해 주세요. 주문번호 : ' + esc(orderId));
      }
      if (!res.ok) return renderFail(data.error, data.message || errorText(data.error), orderId);
      Cart.clear();
      renderComplete(data);
    }

    function errorText(code) {
      return ({
        AMOUNT_MISMATCH: '결제 금액이 주문 금액과 일치하지 않아 승인하지 않았습니다.',
        ORDER_NOT_FOUND: '주문을 찾을 수 없습니다.',
        ORDER_NOT_PAYABLE: '이미 처리되었거나 결제할 수 없는 주문입니다.',
      })[code] || '결제 승인에 실패했습니다.';
    }

    function renderComplete(d) {
      const waiting = d.status === 'WAITING_DEPOSIT';
      const items = (d.items || []).map(it => `${esc(it.name)} / ${esc(it.color)} / ${esc(it.size)} × ${it.qty}`).join('<br>');
      const va = d.virtualAccount ? `<div class="va">
          <b>입금 계좌</b><br>${esc(d.virtualAccount.bank)} ${esc(d.virtualAccount.accountNumber)}<br>
          예금주 : ${esc(d.virtualAccount.customerName)}<br>입금 기한 : ${esc((d.virtualAccount.dueDate || '').replace('T', ' ').slice(0, 16))}<br>
          입금 확인 후 주문이 확정되며 이메일로 안내드립니다.</div>` : '';
      box.innerHTML = `
        <h1>${waiting ? '입금을 기다리고 있습니다' : '✓ 주문이 완료되었습니다'}</h1>
        <div class="row"><span>주문번호</span><b>${esc(d.orderId)}</b></div>
        <div class="row"><span>결제 금액</span><b>${won(d.amount)}</b></div>
        <div class="row"><span>결제 수단</span><b>${esc(d.method || '-')}</b></div>
        ${waiting ? '' : `<div class="row"><span>예상 발송</span><b>2~3영업일 내</b></div>`}
        <div class="items">${items}</div>
        ${va}
        <div class="note">
          주문번호는 교환·반품 접수 시 필요하니 보관해 주세요. 주문 확인 메일을 발송했습니다.<br>
          교환·반품 : 수령 후 7일 이내 <a href="./return.html">반품 접수</a>, 또는 이메일(${esc(GOF_CONFIG.SUPPORT_EMAIL)})<br>
          단순 변심 시 왕복 배송비 6,000원 고객 부담
        </div>
        <div class="btns">
          <a class="btn-full" href="./Shop.html">쇼핑 계속하기</a>
          <a class="btn-full ghost" href="../index.html">홈으로</a>
        </div>`;
    }

    function renderFail(code, message, orderId) {
      box.innerHTML = `
        <h1 class="fail">✗ 결제를 완료하지 못했습니다</h1>
        <p class="msg">${esc(message)}</p>
        <p class="code">코드 : ${esc(code)}${orderId ? ' · 주문번호 : ' + esc(orderId) : ''}</p>
        <div class="btns">
          <a class="btn-full" href="./checkout.html">주문서로 돌아가기</a>
          <a class="btn-full ghost" href="./Shop.html">스토어</a>
        </div>`;
    }

    run();
  </script>
  <script src="../assets/site.js"></script>
</body>
</html>
