<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphics Overfit Order Complete</title>
  <link rel="icon" href="./image/favicon.png" />
  <style>
    body { background-color: #000; margin: 0; padding: 0; font-family: Arial, sans-serif; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    .top-center-logo { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); z-index: 1100; }
    .top-center-logo img { width: 130px; height: 130px; object-fit: contain; }
    .wrap { margin: 140px auto 40px; max-width: 560px; width: calc(100% - 32px); background: #111; border-radius: 10px; padding: 32px 28px; box-sizing: border-box; }
    h1 { font-size: 20px; letter-spacing: 2px; margin: 0 0 20px; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); color: #ccc; }
    .row b { color: #fff; }
    .items { margin: 16px 0; font-size: 13px; color: #ccc; line-height: 1.8; }
    .va { background: rgba(255,255,255,0.06); border-radius: 6px; padding: 12px 14px; font-size: 13px; line-height: 1.8; margin: 14px 0; }
    .note { font-size: 12px; color: #888; line-height: 1.7; margin-top: 18px; }
    .btns { display: flex; gap: 10px; margin-top: 24px; }
    .btn { flex: 1; text-align: center; padding: 14px; border-radius: 6px; font-size: 14px; font-weight: bold; text-decoration: none; border: 1px solid #fff; }
    .btn.solid { background: #fff; color: #000; }
    .btn.ghost { color: #fff; }
    .fail { color: #feacac; }
    @media (max-width: 768px) { .top-center-logo { top: 20px; } .top-center-logo img { width: 90px; height: auto; } .wrap { margin-top: 120px; } }
      footer a { color: #aaa; } .ph { color: #feacac; font-weight: bold; }
  </style>
</head>
<body>
  <div class="top-center-logo"><a href="../index.html"><img src="../image/mainlogo2.png" alt="로고"></a></div>

  <div class="wrap" id="box">
    <h1>결제를 확인하고 있습니다</h1>
    <div class="spinner"></div>
    <p style="text-align:center; color:#aaa; font-size:13px;">잠시만 기다려 주세요. 창을 닫지 마세요.</p>
  </div>

  <footer data-legal-footer="./" style="color:#888; text-align:center; padding:24px 20px; font-size:12px; line-height:1.8;"></footer>
  <script src="./config.js"></script>
  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script>
    const box = document.getElementById('box');
    const won = n => '₩' + new Intl.NumberFormat('ko-KR').format(n);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function run() {
      const p = new URLSearchParams(location.search);
      const paymentKey = p.get('paymentKey'), orderId = p.get('orderId'), amount = Number(p.get('amount'));
      if (!paymentKey || !orderId || !amount) return renderFail('INVALID_URL', '결제 정보가 없습니다. 주문서에서 다시 시도해 주세요.');

      let res, data;
      try {
        res = await fetch(GOF_CONFIG.API_BASE + '/payments/confirm', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentKey, orderId, amount }),
        });
        data = await res.json();
      } catch (e) {
        return renderFail('NETWORK', '서버와 통신하지 못했습니다. 결제가 완료되었는지 이메일을 확인하시거나 문의해 주세요. 주문번호 : ' + esc(orderId));
      }
      if (!res.ok) return renderFail(data.error, data.message || errorText(data.error), orderId);
      Cart.clear();
      renderComplete(data);
    }

    function errorText(code) {
      return ({
        AMOUNT_MISMATCH: '결제 금액이 주문 금액과 일치하지 않아 승인하지 않았습니다.',
        ORDER_NOT_FOUND: '주문을 찾을 수 없습니다.',
        ORDER_NOT_PAYABLE: '이미 처리되었거나 결제할 수 없는 주문입니다.',
      })[code] || '결제 승인에 실패했습니다.';
    }

    function renderComplete(d) {
      const waiting = d.status === 'WAITING_DEPOSIT';
      const items = (d.items || []).map(it => `${esc(it.name)} / ${esc(it.color)} / ${esc(it.size)} × ${it.qty}`).join('<br>');
      const va = d.virtualAccount ? `<div class="va">
          <b>입금 계좌</b><br>${esc(d.virtualAccount.bank)} ${esc(d.virtualAccount.accountNumber)}<br>
          예금주 : ${esc(d.virtualAccount.customerName)}<br>입금 기한 : ${esc((d.virtualAccount.dueDate || '').replace('T', ' ').slice(0, 16))}<br>
          입금 확인 후 주문이 확정되며 이메일로 안내드립니다.</div>` : '';
      box.innerHTML = `
        <h1>${waiting ? '입금을 기다리고 있습니다' : '✓ 주문이 완료되었습니다'}</h1>
        <div class="row"><span>주문번호</span><b>${esc(d.orderId)}</b></div>
        <div class="row"><span>결제 금액</span><b>${won(d.amount)}</b></div>
        <div class="row"><span>결제 수단</span><b>${esc(d.method || '-')}</b></div>
        ${waiting ? '' : `<div class="row"><span>예상 발송</span><b>2~3영업일 내</b></div>`}
        <div class="items">${items}</div>
        ${va}
        <div class="note">
          주문번호는 교환·반품 접수 시 필요하니 보관해 주세요. 주문 확인 메일을 발송했습니다.<br>
          교환·반품 : 수령 후 7일 이내 <a href="./return.html" style="color:#fff">반품 접수</a>, 또는 이메일(${esc(GOF_CONFIG.SUPPORT_EMAIL)})<br>
          단순 변심 시 왕복 배송비 6,000원 고객 부담
        </div>
        <div class="btns">
          <a class="btn solid" href="./Shop.html">쇼핑 계속하기</a>
          <a class="btn ghost" href="../index.html">홈으로</a>
        </div>`;
    }

    function renderFail(code, message, orderId) {
      box.innerHTML = `
        <h1 class="fail">✗ 결제를 완료하지 못했습니다</h1>
        <p style="font-size:14px; line-height:1.7; color:#ccc;">${esc(message)}</p>
        <p style="font-size:12px; color:#888;">코드 : ${esc(code)}${orderId ? ' · 주문번호 : ' + esc(orderId) : ''}</p>
        <div class="btns">
          <a class="btn solid" href="./checkout.html">주문서로 돌아가기</a>
          <a class="btn ghost" href="./Shop.html">스토어</a>
        </div>`;
    }

    run();
  </script>
</body>
</html>
