<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 실패 | Graphics Overfit</title>
  <link rel="icon" href="./image/favicon.png" />
  <link rel="stylesheet" href="../assets/site.css" />
  <style>
    /* 결제 결과 카드 */
    .result-card { max-width: 580px; margin: 0 auto; }
    .result-card h1 { margin: 0 0 20px; font-size: 26px; font-weight: 950; line-height: 1.15; letter-spacing: -0.05em; }
    .result-card h1.fail, .result-card.is-fail h1 { color: #b8431a; }
    .spinner { width: 28px; height: 28px; margin: 20px auto; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; color: var(--muted); }
    .row b { color: var(--ink); font-family: var(--mono); font-size: 13px; }
    .items { margin: 16px 0; font-size: 13px; line-height: 1.8; color: var(--muted); }
    .va { margin: 14px 0; padding: 12px 14px; border: 1px dashed var(--ink); border-radius: 12px; font-size: 13px; line-height: 1.8; }
    .note { margin-top: 18px; font-size: 12px; line-height: 1.7; color: var(--muted); }
    .note a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .msg { margin: 0 0 10px; font-size: 14px; line-height: 1.7; color: var(--muted); }
    .code { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; color: var(--soft); }
    .hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
    .btns { display: flex; gap: 10px; margin-top: 24px; }
    .btns .btn-full { flex: 1; }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="section section--first">
      <div class="wrap">
        <div class="result-card card-box is-fail">
          <h1 id="title">✗ 결제에 실패했습니다</h1>
          <p class="msg" id="msg"></p>
          <p class="code" id="code"></p>
          <p class="note">장바구니는 그대로 남아 있습니다. 다른 결제 수단으로 다시 시도해 주세요.</p>
          <div class="btns">
            <a class="btn-full" href="./checkout.html">주문서로 돌아가기</a>
            <a class="btn-full ghost" href="./Shop.html">스토어</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./config.js"></script>
  <script src="./cart.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code') || '';
    const message = p.get('message') || '';
    const orderId = p.get('orderId') || '';
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    if (code === 'PAY_PROCESS_CANCELED') {
      document.getElementById('title').textContent = '결제를 취소하셨습니다';
      document.getElementById('msg').textContent = '결제창에서 결제가 취소되었습니다.';
    } else {
      document.getElementById('msg').textContent = message || '결제 진행 중 문제가 발생했습니다.';
    }
    document.getElementById('code').innerHTML = (code ? '코드 : ' + esc(code) : '') + (orderId ? ' · 주문번호 : ' + esc(orderId) : '');
  </script>
  <script src="../assets/site.js"></script>
</body>
</html>
