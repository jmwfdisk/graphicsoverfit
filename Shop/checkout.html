<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Graphics Overfit</title>
  <link rel="icon" href="./image/favicon.png" />
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <link rel="stylesheet" href="../assets/site.css" />
  <style>
    /* ===== 주문서 : 왼쪽 주문 내용·입력 / 오른쪽 결제 요약 ===== */
    .checkout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 44px; align-items: start; }
    #left > h2:first-of-type { margin-top: 0; }
    .cart-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .cart-table td { padding: 12px 8px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
    .cart-table img { display: block; width: 76px; height: 76px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .cart-table .name { font-weight: bold; }
    .cart-table .opt { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--ink); border-radius: 30px; }
    .qty button { width: 30px; height: 30px; font-size: 16px; }
    .qty span { min-width: 24px; text-align: center; font-size: 13px; }
    .remove { font-size: 15px; color: var(--soft); }
    .remove:hover { color: var(--orange); }
    .empty { padding: 50px 0; text-align: center; color: var(--muted); }
    /* 장바구니가 비면 스크립트가 요약 칸을 숨긴다 → 왼쪽 칸을 전체 폭으로 넓혀 안내 문구가 화면 가운데에 오게 한다 */
    .checkout:has(.empty) { grid-template-columns: 1fr; }
    .checkout:has(.empty) #left > h2 { display: none; }
    .empty a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    .zip-row { display: flex; gap: 8px; }
    .zip-row input { flex: 1; }
    .btn-small { padding: 0 18px; border: 1px solid var(--ink); border-radius: 30px; font-size: 12px; white-space: nowrap; }
    .btn-small:hover { background: var(--ink); color: var(--paper); }

    .summary { position: sticky; top: 90px; padding: 20px; border: 1px solid var(--ink); border-radius: 18px; background: #fbfaf5; }
    .summary .line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
    .summary .grand { display: flex; justify-content: space-between; margin: 6px 0 16px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 18px; font-weight: 950; letter-spacing: -0.02em; }
    .widget-box { margin: 0 -20px 8px; min-height: 40px; }   /* 위젯이 자체 흰 카드를 그리므로 래퍼는 투명, 카드 좌우 폭만 맞춤 */
    .pay-btn { margin-top: 10px; }
    .note { margin-top: 12px; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .shop-form .consent { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0 0; font-family: inherit; font-size: 12px; letter-spacing: 0; line-height: 1.5; color: var(--muted); cursor: pointer; }
    .consent input { flex: none; margin-top: 2px; }
    .consent a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .error-box { display: none; margin-top: 10px; padding: 10px 14px; border: 1px solid var(--orange); border-radius: 12px; background: rgba(242, 107, 56, 0.1); font-size: 13px; color: #b8431a; }
    .error-box.show { display: block; }

    @media (max-width: 900px) {
      .checkout { grid-template-columns: 1fr; gap: 28px; }
      .summary { position: static; }
      .pay-btn { position: sticky; bottom: 10px; }
    }
    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .cart-table img { width: 52px; height: 66px; }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="section section--first">
      <div class="wrap shop-form">
        <div class="section-head">
          <p class="label"><span>Shop</span><span>·</span><span>Checkout</span></p>
          <div class="section-head-grid">
            <h1 class="display display--md">CHECKOUT<span class="title-dot">.</span></h1>
          </div>
        </div>
        <div class="checkout">
          <section id="left">
            <h2>1. 주문 상품</h2>
            <div id="cartArea"></div>

            <div id="formArea">
              <h2>2. 주문자</h2>
              <div class="form-row">
                <div><label for="name">이름</label><input id="name" maxlength="40" autocomplete="name" /></div>
                <div><label for="phone">연락처</label><input id="phone" inputmode="tel" placeholder="010-0000-0000" maxlength="13" autocomplete="tel" /></div>
              </div>
              <div class="form-row full">
                <div><label for="email">이메일 (주문 확인 메일 발송)</label><input id="email" type="email" maxlength="120" autocomplete="email" /></div>
              </div>

              <h2>3. 배송지</h2>
              <div class="form-row full">
                <div>
                  <label for="zip">우편번호</label>
                  <div class="zip-row"><input id="zip" readonly placeholder="우편번호 찾기를 눌러주세요" /><button type="button" class="btn-small" onclick="findAddress()">우편번호 찾기</button></div>
                </div>
              </div>
              <div class="form-row full"><div><label for="addr1">주소</label><input id="addr1" readonly /></div></div>
              <div class="form-row full"><div><label for="addr2">상세 주소</label><input id="addr2" maxlength="200" placeholder="동·호수 등" /></div></div>
              <div class="form-row full">
                <div>
                  <label for="memoSel">배송 메모</label>
                  <select id="memoSel" onchange="onMemoChange()">
                    <option value="">선택 안 함</option>
                    <option>문 앞에 놓아주세요</option>
                    <option>경비실에 맡겨주세요</option>
                    <option>배송 전 연락 주세요</option>
                    <option value="__custom">직접 입력</option>
                  </select>
                  <input id="memoCustom" maxlength="200" placeholder="배송 메모를 입력하세요" style="display:none; margin-top:8px;" />
                </div>
              </div>
            </div>
          </section>

          <aside class="summary" id="summary">
            <div class="line"><span>상품 합계</span><span id="sumSubtotal">₩0</span></div>
            <div class="line"><span>배송비</span><span>무료</span></div>
            <div class="grand"><span>총 결제 금액</span><span id="sumGrand">₩0</span></div>

            <div class="widget-box"><div id="payment-method"></div></div>
            <div class="widget-box"><div id="agreement"></div></div>
            <label class="consent"><input type="checkbox" id="agreeTerms"> <span><a href="./terms.html" target="_blank">이용약관</a> 및 <a href="./privacy.html" target="_blank">개인정보 수집·이용</a>에 동의합니다 (필수)</span></label>
            <label class="consent"><input type="checkbox" id="agreeReturn"> <span>청약철회 안내를 확인했습니다 : 수령 후 7일 이내 교환·반품 가능, 단순 변심 시 왕복 배송비 6,000원 고객 부담 (필수)</span></label>
            <button class="pay-btn btn-full" id="payBtn" disabled>결제하기</button>
            <div class="error-box" id="errorBox"></div>
            <div class="note">
              결제는 토스페이먼츠를 통해 처리되며 카드 정보는 저장하지 않습니다.<br>
              문의 : <span id="noteEmail"></span>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./config.js"></script>
  <script src="./products.js"></script>
  <script src="./cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('noteEmail').textContent = GOF_CONFIG.SUPPORT_EMAIL;
    });

    // ===== 장바구니 표시 =====
    const cartArea = document.getElementById('cartArea');
    const formArea = document.getElementById('formArea');
    const summary = document.getElementById('summary');

    function renderCart() {
      const t = Cart.total();
      document.getElementById('sumSubtotal').textContent = GOF.won(t.subtotal);
      document.getElementById('sumGrand').textContent = GOF.won(t.grand);
      if (t.items.length === 0) {
        cartArea.innerHTML = `<div class="empty">담긴 상품이 없습니다.<br><br><a href="./Shop.html">스토어로 가기 →</a></div>`;
        formArea.style.display = 'none';
        summary.style.display = 'none';
        return t;
      }
      formArea.style.display = '';
      summary.style.display = '';
      const rows = t.items.map(it => {
        const img = it.product ? GOF.imagesOf(it.product, it.color).slice(-2)[0] : '';
        return `<tr>
          <td style="width:64px"><img src="${img}" alt=""></td>
          <td><div class="name">${it.name}</div><div class="opt">${it.color} / ${it.size}</div></td>
          <td style="width:100px">
            <div class="qty">
              <button type="button" onclick="setQty('${it.id}','${it.color}','${it.size}',${it.qty - 1})">−</button>
              <span>${it.qty}</span>
              <button type="button" onclick="setQty('${it.id}','${it.color}','${it.size}',${it.qty + 1})">+</button>
            </div>
          </td>
          <td style="width:90px; text-align:right">${GOF.won(it.lineTotal)}</td>
          <td style="width:30px; text-align:right"><button class="remove" title="삭제" onclick="setQty('${it.id}','${it.color}','${it.size}',0)">✕</button></td>
        </tr>`;
      }).join('');
      cartArea.innerHTML = `<table class="cart-table"><tbody>${rows}</tbody></table>`;
      return t;
    }
    function setQty(id, color, size, qty) { Cart.setQty(id, color, size, qty); }
    document.addEventListener('gof:cart-changed', async () => {
      const t = renderCart();
      if (widgets && t.grand > 0) await widgets.setAmount({ currency: 'KRW', value: t.grand });
    });

    // ===== 우편번호 =====
    function findAddress() {
      new daum.Postcode({
        oncomplete(data) {
          document.getElementById('zip').value = data.zonecode;
          document.getElementById('addr1').value = data.roadAddress || data.jibunAddress;
          document.getElementById('addr2').focus();
        }
      }).open();
    }
    function onMemoChange() {
      const sel = document.getElementById('memoSel');
      document.getElementById('memoCustom').style.display = sel.value === '__custom' ? '' : 'none';
    }
    document.getElementById('phone').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      e.target.value = d.length > 7 ? d.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3') : d.length > 3 ? d.replace(/(\d{3})(\d+)/, '$1-$2') : d;
    });

    // ===== 토스 결제위젯 =====
    let widgets = null;
    const payBtn = document.getElementById('payBtn');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function clearError() { errorBox.classList.remove('show'); }

    async function initWidget() {
      const t = renderCart();
      if (t.items.length === 0) return;
      try {
        const tossPayments = TossPayments(GOF_CONFIG.TOSS_CLIENT_KEY);
        widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });
        await widgets.setAmount({ currency: 'KRW', value: t.grand });
        await Promise.all([
          widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
          widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
        ]);
        payBtn.disabled = false;
      } catch (e) {
        console.error(e);
        showError('결제창을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      }
    }
    initWidget();

    function readForms() {
      const v = id => document.getElementById(id).value.trim();
      const memoSel = v('memoSel');
      return {
        buyer: { name: v('name'), phone: v('phone'), email: v('email') },
        shipping: { zip: v('zip'), addr1: v('addr1'), addr2: v('addr2'), memo: memoSel === '__custom' ? v('memoCustom') : memoSel },
      };
    }
    function validate(f) {
      const bad = [];
      const mark = (id, ok) => { document.getElementById(id).classList.toggle('invalid', !ok); if (!ok) bad.push(id); };
      mark('name', f.buyer.name.length >= 1);
      mark('phone', /^\d{9,11}$/.test(f.buyer.phone.replace(/\D/g, '')));
      mark('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.buyer.email));
      mark('zip', /^\d{5}$/.test(f.shipping.zip));
      mark('addr1', f.shipping.addr1.length >= 3);
      if (bad.length) { document.getElementById(bad[0]).focus(); showError('주문자·배송지 정보를 확인해 주세요.'); return false; }
      return true;
    }

    payBtn.addEventListener('click', async () => {
      clearError();
      const f = readForms();
      if (!validate(f)) return;
      if (!document.getElementById('agreeTerms').checked || !document.getElementById('agreeReturn').checked) {
        showError('이용약관·개인정보 수집 동의와 청약철회 안내 확인에 체크해 주세요.'); return;
      }
      payBtn.disabled = true;
      payBtn.textContent = '주문 생성 중…';
      try {
        // ① 서버에 주문 생성 → 서버가 금액 확정
        const res = await fetch(GOF_CONFIG.API_BASE + '/orders', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: Cart.get(), buyer: f.buyer, shipping: f.shipping }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(orderErrorText(data.error));
        await widgets.setAmount({ currency: 'KRW', value: data.amount });
        payBtn.textContent = '결제창 여는 중…';

        // ② 결제창 호출 → 성공/실패 URL로 리다이렉트
        await widgets.requestPayment({
          orderId: data.orderId,
          orderName: data.orderName,
          successUrl: location.origin + location.pathname.replace(/checkout\.html$/, 'success.html'),
          failUrl: location.origin + location.pathname.replace(/checkout\.html$/, 'fail.html'),
          customerEmail: f.buyer.email,
          customerName: f.buyer.name,
          customerMobilePhone: f.buyer.phone.replace(/\D/g, ''),
        });
      } catch (e) {
        console.error(e);
        showError(e.message || '결제를 시작하지 못했습니다.');
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = '결제하기';
      }
    });

    function orderErrorText(code) {
      return ({
        SOLD_OUT: '품절된 옵션이 포함되어 있습니다. 장바구니를 확인해 주세요.',
        UNKNOWN_PRODUCT: '판매 중이 아닌 상품이 포함되어 있습니다.',
        BAD_QTY: '수량은 1~10개까지 가능합니다.',
        EMPTY_CART: '장바구니가 비어 있습니다.',
        BAD_BUYER: '주문자 정보를 확인해 주세요.',
        BAD_SHIPPING: '배송지 정보를 확인해 주세요.',
      })[code] || ('주문을 생성하지 못했습니다. (' + (code || '네트워크 오류') + ')');
    }
  </script>
  <script src="../assets/site.js"></script>
</body>
</html>
